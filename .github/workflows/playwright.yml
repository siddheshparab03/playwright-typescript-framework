# Runs the Playwright tests on GitHub's servers for every pull request and every push to main.
# The test accounts come from GitHub Secrets (repo Settings > Secrets and variables > Actions),
# never from the code. GitHub hides secret values in the logs.
name: Playwright tests

on:
  pull_request:
  push:
    branches: [main]
  # Adds a "Run workflow" button on the Actions tab to start a run by hand
  workflow_dispatch:

# All runs share the same 3 test accounts, and the site empties an account's cart whenever it
# logs in. Two runs at the same time would break each other's carts, so only one run at a time:
# a new run waits until the previous one has finished.
concurrency:
  group: shared-test-accounts
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        # npm ci installs exactly the versions in package-lock.json (faster and stricter than npm install)
        run: npm ci

      - name: Install the Chromium browser
        # --with-deps also installs the Linux libraries the browser needs
        run: npx playwright install --with-deps chromium

      - name: Check TypeScript
        run: npm run typecheck

      - name: Check code with ESLint
        # Fails the run on mistakes such as a missing await
        run: npm run lint

      - name: Check formatting with Prettier
        # Fails the run if a file is not formatted; fix locally with: npm run format
        run: npm run format:check

      - name: Run Playwright tests
        run: npx playwright test
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          CART_USER_EMAIL: ${{ secrets.CART_USER_EMAIL }}
          CART_USER_PASSWORD: ${{ secrets.CART_USER_PASSWORD }}
          ORDER_USER_EMAIL: ${{ secrets.ORDER_USER_EMAIL }}
          ORDER_USER_PASSWORD: ${{ secrets.ORDER_USER_PASSWORD }}

      - name: Upload the HTML report
        # always(): upload even when tests failed, because that is when the report matters most
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
